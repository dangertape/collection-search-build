[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collection-search"
version = "0.2.0"
description = "Local semantic search over document collections, for Claude via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "numpy>=1.24",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "watchdog>=4.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
collection-search-cli = "collection_search.cli:main"
collection-search-mcp = "collection_search.shim:main"

[project.gui-scripts]
collection-search = "collection_search.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
