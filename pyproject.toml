[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collection-search"
version = "0.1.0"
description = "Local semantic search over document collections, for Claude via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
collection-search-cli = "collection_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
